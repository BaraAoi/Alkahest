name: Build Alkahest
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            python3 -c 'import pathlib; s=pathlib.Path("build.log").read_text()[:30000]; print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Gameplay tests
        run: |
          set +e
          ./gradlew runGametest --no-daemon --console=plain > gametest.log 2>&1
          result=$?
          cat gametest.log
          if [ "$result" -ne 0 ]; then
            python3 -c 'import pathlib; p=pathlib.Path("build/gametest-results.xml"); s=p.read_text() if p.exists() else pathlib.Path("gametest.log").read_text()[-3800:]; print("::error::" + s[:3900].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Check distillery UI assets
        run: python3 scripts/check_distillery_ui.py
      - name: Server startup smoke test
        run: python3 scripts/smoke_test.py server
      - name: Client startup smoke test
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          python3 scripts/smoke_test.py client
      - uses: actions/upload-artifact@v4
        with:
          name: Alkahest-fabric-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
