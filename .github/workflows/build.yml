name: Build Alkahest
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: |
          set +e
          ./gradlew build --stacktrace > build.log 2>&1
          result=$?
          cat build.log
          if [ "$result" -ne 0 ]; then
            python3 -c 'import pathlib; s=pathlib.Path("build.log").read_text()[:30000]; print("::error::" + s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))'
          fi
          exit "$result"
      - name: Server startup smoke test
        run: python3 scripts/smoke_test.py server
      - name: Client startup smoke test
        run: |
          if ! command -v xvfb-run >/dev/null; then sudo apt-get update && sudo apt-get install -y xvfb; fi
          python3 scripts/smoke_test.py client
      - uses: actions/upload-artifact@v4
        with:
          name: Alkahest-fabric-1.21.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
      - name: Transfer verified JAR to workspace
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' -print -quit)
          python3 -c 'import base64,json,sys; print(json.dumps({"content":base64.b64encode(open(sys.argv[1],"rb").read()).decode(),"encoding":"base64"}))' "$jar" > /tmp/alkahest-blob.json
          sha=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input /tmp/alkahest-blob.json --jq .sha)
          echo "::notice title=Build blob::JAR_BLOB=$sha"
